{% extends 'exommerce/base.html' %}

{% block title %}Delete "{{ post.title }}" – Blog{% endblock %}

{% block content %}
<section class="form-section">
  <div class="form-card delete-card">
    <div class="delete-icon">🗑️</div>
    <h1>Delete Post?</h1>
    <p class="delete-warning">
      You are about to permanently delete the post<br>
      <strong>"{{ post.title }}"</strong>.<br>
      This action <span class="text-danger">cannot be undone</span>.
    </p>

    <form method="post">
      {% csrf_token %}
      <div class="form-actions center">
        <a href="{% url 'blog:post_list' %}" class="btn btn-outline">← Cancel</a>
        <button type="submit" class="btn btn-danger">Yes, Delete it!</button>
      </div>
    </form>
  </div>
</section>
{% endblock %}
